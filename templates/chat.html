<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premium Car AI Agent</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.10), transparent 25%),
        radial-gradient(circle at bottom right, rgba(168,85,247,0.10), transparent 30%),
        linear-gradient(180deg,#f8fafc,#eef2f7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 90%;
      max-width: 900px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 20px 45px rgba(15,23,42,0.08),
        0 2px 6px rgba(15,23,42,0.04);
      overflow: hidden;
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.85);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .title {
      font-weight: bold;
      font-size: 18px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 6px;
      display: none;
    }

    .brand-fallback {
      min-width: 42px;
      height: 42px;
      border-radius: 12px;
      padding: 0 10px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid #111827;
      color: #111827;
      background: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #sessionBadge {
      margin-top: 4px;
      font-size: 12px;
      color: #6b7280;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .reset-button {
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    .reset-button:hover {
      background: #f9fafb;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.agent {
      justify-content: flex-start;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .message.user {
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.agent {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .composer {
      border-top: 1px solid #eee;
      padding: 12px 18px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }

    .composer input {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .composer input:focus {
      border-color: #111827;
    }
    .composer button {
      flex: 0 0 auto;
    }    
    
    button {
      background: #111827;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing {
      padding: 10px 14px;
      border-radius: 14px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      color: #6b7280;
    }
    .quick-replies {
      border-top: 1px solid #eee;
      padding: 10px 18px 4px;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      background: #ffffff;
      box-sizing: border-box;
    }

    .quick-reply {
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .quick-reply:hover {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div class="brand-row">
      <img id="brandLogo" class="brand-logo" alt="" />
      <div id="brandFallback" class="brand-fallback"></div>
      <div>
        <div id="agentTitle" class="title">AI Sales Agent</div>
        <div id="sessionBadge"></div>
      </div>
    </div>

    <div class="header-actions">
      <button id="resetButton" class="reset-button" title="Nueva consulta" aria-label="Nueva consulta">↻</button>
    </div>
  </div>

 <div id="chat" class="chat"></div>

<div id="quickReplies" class="quick-replies"></div>

<div class="composer">
  <input id="input" placeholder="Escribe tu mensaje..." autocomplete="off">
  <button id="sendButton">Enviar</button>
</div>

<script>
/*
  Chat de prueba conectado directo a FastAPI.

  Producción local:
    /premium-agent

  Test endpoint:
    /premium-agent
*/
const IS_LOCAL =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1";

const AGENT_URL =
  localStorage.getItem("premiumCarAgentUrl") ||
  "/premium-agent";

const params = new URLSearchParams(window.location.search);

function inferTenantIdFromHostname(hostname) {
  const normalizedHostname = String(hostname || "").toLowerCase();

  if (normalizedHostname.includes("volvo-demo")) {
    return "volvo_colombia";
  }

  if (normalizedHostname.includes("caminos-demo")) {
    return "caminos_eje_cafetero";
  }

  if (
  normalizedHostname.includes("dealer") ||
  normalizedHostname.includes("caminos")
  ) {
    return "dealer_multi_brand";
  }

  return "volvo_colombia";
}

const tenantId =
  params.get("tenant_id") ||
  inferTenantIdFromHostname(window.location.hostname);

const TENANT_GREETINGS = {
  volvo_colombia: "Hola, soy tu asesor virtual. \n¿En qué puedo ayudarte hoy?",
  caminos_eje_cafetero: "Hola, soy tu asesor virtual de Caminos Chevrolet.\n ¿Qué tipo de vehículo estás buscando hoy?"
};

const fallbackGreeting = "Hola, soy tu asesor virtual. ¿En qué puedo ayudarte?";

const TENANT_BRANDING = {
  volvo_colombia: {
    title: "Dealer AI Agent",
    logo: "/static/brands/volvo.png",
    fallback: "DEALER AI"
  },
  caminos_eje_cafetero: {
    title: "Caminos Chevrolet AI Sales Agent",
    logo: "/static/brands/chevrolet.png",
    fallback: "CHEVROLET"
  }
};

const fallbackBranding = {
  title: "AI Sales Agent",
  logo: "",
  fallback: ""
};

const STORAGE_KEYS = {
  sessionId: "premiumCarSessionId",
  messages: "premiumCarMessages",
  leadState: "premiumCarLeadState",
  conversationHistory: "premiumCarConversationHistory"
};

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");
const resetButton = document.getElementById("resetButton");
const agentTitle = document.getElementById("agentTitle");
const brandLogo = document.getElementById("brandLogo");
const brandFallback = document.getElementById("brandFallback");
const sessionBadge = document.getElementById("sessionBadge");
const quickReplies = document.getElementById("quickReplies");

const state = {
  sessionId: getOrCreateSessionId(),
  messages: getStoredArray(STORAGE_KEYS.messages),
  conversationHistory: getStoredArray(STORAGE_KEYS.conversationHistory),
  leadState: getStoredObject(STORAGE_KEYS.leadState)
};

function updateSessionBadge() {
  sessionBadge.innerText = "Sesión: " + state.sessionId + " · Tenant: " + tenantId;
}

function getTenantGreeting() {
  return TENANT_GREETINGS[tenantId] || fallbackGreeting;
}

function getTenantBranding() {
  return TENANT_BRANDING[tenantId] || fallbackBranding;
}

function showBrandFallback(config) {
  brandLogo.style.display = "none";

  if (config.fallback) {
    brandFallback.innerText = config.fallback;
    brandFallback.style.display = "inline-flex";
  } else {
    brandFallback.innerText = "";
    brandFallback.style.display = "none";
  }
}

function updateBranding() {
  const config = getTenantBranding();

  agentTitle.innerText = config.title;
  document.title = config.title;

  brandLogo.removeAttribute("src");
  brandLogo.style.display = "none";
  brandFallback.style.display = "none";
  brandFallback.innerText = "";

  if (!config.logo) {
    showBrandFallback(config);
    return;
  }

  brandLogo.onload = () => {
    brandFallback.style.display = "none";
    brandLogo.style.display = "block";
  };

  brandLogo.onerror = () => {
    showBrandFallback(config);
  };

  brandLogo.alt = config.fallback || config.title;
  brandLogo.src = config.logo;
}

function getOrCreateSessionId() {
  let sessionId = localStorage.getItem(STORAGE_KEYS.sessionId);

  if (!sessionId) {
    sessionId = "chat-" + Date.now();
    localStorage.setItem(STORAGE_KEYS.sessionId, sessionId);
  }

  return sessionId;
}

function getStoredArray(key) {
  try {
    return JSON.parse(localStorage.getItem(key)) || [];
  } catch {
    return [];
  }
}

function getStoredObject(key) {
  try {
    return JSON.parse(localStorage.getItem(key)) || {};
  } catch {
    return {};
  }
}

function persistState() {
  localStorage.setItem(STORAGE_KEYS.sessionId, state.sessionId);
  localStorage.setItem(STORAGE_KEYS.messages, JSON.stringify(state.messages.slice(-60)));
  localStorage.setItem(STORAGE_KEYS.conversationHistory, JSON.stringify(state.conversationHistory.slice(-12)));
  localStorage.setItem(STORAGE_KEYS.leadState, JSON.stringify(state.leadState || {}));
}

function addMessage(role, text, persist = true) {
  const row = document.createElement("div");
  row.className = "message-row " + role;

  const bubble = document.createElement("div");
  bubble.className = "message " + role;
  bubble.innerText = text;

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;

  if (persist && text !== "Escribiendo...") {
    state.messages.push({ role, text });

    const historyRole = role === "agent" ? "assistant" : "user";
    state.conversationHistory.push({
      role: historyRole,
      content: text
    });

    state.messages = state.messages.slice(-60);
    state.conversationHistory = state.conversationHistory.slice(-12);
    persistState();
  }
}

function restoreMessages() {
  chat.innerHTML = "";

  if (state.messages.length === 0) {
    addMessage("agent", getTenantGreeting());
    return;
  }

  state.messages.forEach((item) => {
    addMessage(item.role, item.text, false);
  });

  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  removeTyping();

  const row = document.createElement("div");
  row.className = "message-row agent";
  row.id = "typing";

  const bubble = document.createElement("div");
  bubble.className = "typing";
  bubble.innerText = "Escribiendo...";

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById("typing");
  if (typing) typing.remove();
}

function getAgentReply(data) {
  return (
    data.assistant_reply ||
    data.reply ||
    data.message ||
    data.response ||
    data.output ||
    data.json?.assistant_reply ||
    data.json?.reply ||
    data.body?.assistant_reply ||
    data.body?.reply ||
    "Sin respuesta del agente."
  );
}

function getUpdatedLeadState(data) {
  return (
    data.updated_lead_state ||
    data.lead_state ||
    data.json?.updated_lead_state ||
    data.body?.updated_lead_state ||
    {}
  );
}

function getQuickReplies(data) {
  const replies =
    data.quick_replies ||
    data.quickReplies ||
    data.json?.quick_replies ||
    data.json?.quickReplies ||
    data.body?.quick_replies ||
    data.body?.quickReplies ||
    [];

  if (!Array.isArray(replies)) {
    return [];
  }

  return replies
    .map(reply => String(reply || "").trim())
    .filter(reply => reply)
    .slice(0, 12);
}

function renderQuickReplies(replies) {
  quickReplies.innerHTML = "";

  if (!Array.isArray(replies) || replies.length === 0) {
    quickReplies.style.display = "none";
    return;
  }

  replies.forEach(reply => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "quick-reply";
    button.innerText = reply;

    button.addEventListener("click", () => {
      quickReplies.innerHTML = "";
      quickReplies.style.display = "none";

      input.value = reply;
      sendMessage();
    });

    quickReplies.appendChild(button);
  });

  quickReplies.style.display = "flex";
}


function mergeLeadState(updatedLeadState) {
  if (!updatedLeadState || typeof updatedLeadState !== "object") {
    return;
  }

  state.leadState = {
    ...state.leadState,
    ...updatedLeadState
  };

  persistState();
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message || sendButton.disabled) return;

  renderQuickReplies([]);

  addMessage("user", message);
  input.value = "";
  sendButton.disabled = true;
  addTyping();

  try {
    const payload = {
      session_id: state.sessionId,
      user_message: message,
      message: message,
      tenant_id: tenantId,

      // -----------------------------
      // Estado acumulado enviado al backend
      // -----------------------------
      // Esto evita que el agente olvide nombre, ciudad, presupuesto,
      // modelo de interés y demás datos capturados en turnos previos.
      lead_state: state.leadState || {},
      conversation_history: state.conversationHistory.slice(-8),
      catalog_context: "",
      metadata: {
        source: "chat-html",
        mode: "direct-fastapi-chat",
        tenant_id: tenantId
      }
    };

    const res = await fetch(AGENT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const text = await res.text();

    if (!res.ok) {
      throw new Error("HTTP " + res.status + ": " + text);
    }

    if (!text) {
      throw new Error("Respuesta vacía desde el agente.");
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch (parseError) {
      throw new Error("La respuesta no es JSON válido: " + text);
    }

    removeTyping();

    mergeLeadState(getUpdatedLeadState(data));

    const reply = getAgentReply(data);
    addMessage("agent", reply);

    renderQuickReplies(getQuickReplies(data));

  } catch (err) {
    removeTyping();
    console.error("Chat error:", err);

    addMessage(
      "agent",
      "Estoy teniendo un problema técnico. Intenta nuevamente en unos segundos."
    );
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
}

function resetConversation() {
  localStorage.removeItem(STORAGE_KEYS.sessionId);
  localStorage.removeItem(STORAGE_KEYS.messages);
  localStorage.removeItem(STORAGE_KEYS.leadState);
  localStorage.removeItem(STORAGE_KEYS.conversationHistory);

  state.sessionId = "chat-" + Date.now();
  state.messages = [];
  state.conversationHistory = [];
  state.leadState = {};

  localStorage.setItem(STORAGE_KEYS.sessionId, state.sessionId);

  chat.innerHTML = "";
  renderQuickReplies([]);
  updateSessionBadge();
  addMessage("agent", getTenantGreeting());
  input.focus();
}

sendButton.addEventListener("click", sendMessage);

resetButton.addEventListener("click", resetConversation);

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

updateBranding();
updateSessionBadge();
restoreMessages();
input.focus();
</script>

</body>
</html>
